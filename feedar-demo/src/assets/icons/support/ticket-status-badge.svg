<svg data-asset-id="FDR-TICKET-STATUS-BADGE" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>ticket-status-badge — Prototype — Pending Approval</title>
  <desc>One template with exactly five states: open, in_review, awaiting_reply, resolved and closed. Legacy new is an alias of open, not a separate state or permission. Prototype — Pending Approval; not final or installed.</desc>
