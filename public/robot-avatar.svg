<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" role="img" aria-labelledby="title"><title id="title">ربات هوشمند سازمان</title>
<defs><linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".4" stop-color="#f0f5ff"/><stop offset=".8" stop-color="#afbad1"/><stop offset="1" stop-color="#e2ecff"/></linearGradient><linearGradient id="face" x2="1" y2="1"><stop stop-color="#102031"/><stop offset="1" stop-color="#040917"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#84edff"/><stop offset="1" stop-color="#597dff"/></linearGradient><radialGradient id="halo"><stop stop-color="#538dff" stop-opacity=".3"/><stop offset="1" stop-color="#538dff" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#020719" flood-opacity=".5"/></filter></defs>
<style>.body{animation:float 4s ease-in-out infinite;transform-origin:250px 270px}.eye{animation:blink 6s infinite;transform-box:fill-box;transform-origin:center}.hand{animation:wave 4s ease-in-out infinite;transform-origin:365px 315px}.antenna{animation:pulse 2s infinite}@keyframes float{50%{transform:translateY(-12px) rotate(1deg)}}@keyframes blink{0%,43%,49%,100%{transform:scaleY(1)}46%{transform:scaleY(.12)}}@keyframes wave{50%{transform:rotate(-12deg)}}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.body,.eye,.hand,.antenna{animation:none}}</style>
