<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Telepresence</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect x=%224%22 y=%228%22 width=%2216%22 height=%2211%22 rx=%223%22 fill=%22%233b82f6%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    // An invite link to the bare site address still reaches the robot
    if (new URLSearchParams(location.search).has('serial')) location.replace('user.html' + location.search);
  </script>
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
    .wrap { width: min(720px, 100%); display: grid; gap: 22px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    a.panel { color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
    a.panel:hover { border-color: var(--accent); transform: translateY(-2px); }
    a.panel h3 { font-size: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1 style="font-size:26px">Robot Telepresence</h1>
      <p class="muted" style="margin-top:6px">Open one app on each laptop.</p>
    </div>
    <div class="grid">
      <a class="panel" href="robot.html">
        <h2>On the robot</h2>
        <h3>Robot Station →</h3>
        <p class="muted">Streams the camera, gets a serial number and drives the Arduino Uno over USB.</p>
      </a>
      <a class="panel" href="user.html">
        <h2>For the driver</h2>
        <h3>Robot Control →</h3>
        <p class="muted">Enter the robot's serial number to see its view and drive it.</p>
      </a>
    </div>
  </div>
</body>
</html>
